name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: syntax
        run: |
          for f in bin/opencode-unlimited lib/*.js plugins/*.js; do
            node --check "$f"
            echo "ok $f"
          done

      - name: help
        run: node bin/opencode-unlimited help

      - name: version
        run: node bin/opencode-unlimited version
